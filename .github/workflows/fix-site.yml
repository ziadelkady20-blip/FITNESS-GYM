name: Apply requested website fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Fix hero readability and women hours
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '08:00–22:00': '8 AM to 10 PM',
              '08:00-22:00': '8 AM to 10 PM',
              '08:00 — 22:00': '8 AM to 10 PM',
              '08:00 - 22:00': '8 AM to 10 PM',
              '08—22': '8 AM to 10 PM',
              '08–22': '8 AM to 10 PM',
              '08 - 22': '8 AM to 10 PM',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          cat >> styles/premium.css <<'EOF'

/* Final hero readability polish */
.hero-copy h1{line-height:.88 !important;}
.hero-copy h1 span{display:block !important;font-size:.82em !important;line-height:.88 !important;letter-spacing:-.04em !important;white-space:nowrap !important;color:var(--red) !important;-webkit-text-stroke:1px rgba(0,0,0,.45);paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.72),0 0 52px rgba(255,22,22,.28) !important;}
@media(max-width:620px){.hero-copy h1{line-height:.86 !important;}.hero-copy h1 span{font-size:.82em !important;line-height:.86 !important;-webkit-text-stroke:.7px rgba(0,0,0,.5);}}
EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles/premium.css
          git commit -m 'fix hero readability and women hours' || exit 0
          git push
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/fix-site.yml
          git commit -m 'chore: remove temporary site fix workflow'
          git push
