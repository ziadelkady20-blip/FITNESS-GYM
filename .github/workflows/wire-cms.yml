name: Wire FITNESS GYM CMS
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire-cms:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject public CMS client
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="scripts/site-data.js"></script>'
          if tag not in s:
              marker='  <script>\n'
              if marker not in s:
                  raise SystemExit('index.html inline script marker not found')
              s=s.replace(marker, '  '+tag+'\n'+marker, 1)
              p.write_text(s)
              print('CMS client injected')
          else:
              print('CMS client already wired')
          PY
      - name: Commit CMS wiring
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: wire FITNESS GYM CMS into website'
          git push
